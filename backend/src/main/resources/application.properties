spring.application.name=tucancha-backend

# ===== Datasource MySQL =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tucancha}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-de-al-menos-32-bytes-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== OAuth2 Google =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:demo-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:demo-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===== App =====
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost/oauth2/redirect}
app.cors.origins=${CORS_ORIGINS:http://localhost,http://localhost:5173,http://localhost:3000,http://localhost:80}

# ===== MercadoPago =====
app.mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-XXXXXXXXXXXX}
app.mercadopago.public-key=${MP_PUBLIC_KEY:TEST-XXXXXXXXXXXX}
app.mercadopago.webhook-url=${MP_WEBHOOK_URL:http://localhost:8080/api/pagos/webhook}
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:demo-secret}
app.mercadopago.webhook-validate=${MP_WEBHOOK_VALIDATE:false}

server.port=8080

# ===== Email (opcional) =====
# Para habilitar, seteá MAIL_ENABLED=true y configurá SMTP (ej. Gmail):
#   MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USER=xxx MAIL_PASS=xxx MAIL_FROM=xxx
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@tucancha.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Respetar X-Forwarded-* (proto, host) que vienen desde nginx/ngrok,
# para que Spring arme bien las redirect URIs con https
server.forward-headers-strategy=framework
